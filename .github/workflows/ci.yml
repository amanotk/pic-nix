name: ci

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

jobs:
  python-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[test]"

      - name: Run Python tests
        run: |
          python -m pytest python/tests

  build-test:
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
        petsc: ["OFF", "ON"]
    env:
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            pkg-config \
            openmpi-bin \
            libopenmpi-dev
          if [ "${{ matrix.petsc }}" = "ON" ]; then
            sudo apt-get install -y libpetsc-real-dev || sudo apt-get install -y libpetsc-dev petsc-dev
          fi

      - name: Install C++ dependencies
        run: |
          scripts/install_dependencies.sh "$HOME/usr"
          scripts/install_catch2v3.sh "$HOME/usr"

      - name: Build and test
        run: |
          export DEPS="$HOME/usr"
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_CXX_COMPILER=mpicxx \
            -DCMAKE_PREFIX_PATH="$DEPS" \
            -DPICNIX_USE_SYSTEM_LIBS=ON \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            -DPICNIX_ENABLE_PETSC=${{ matrix.petsc }} \
            -DPICNIX_CATCH2_CONFIG="$DEPS/lib/cmake/Catch2/Catch2Config.cmake"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  fetchcontent-test:
    runs-on: ubuntu-24.04
    env:
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ openmpi-bin libopenmpi-dev

      - name: Install Catch2 v3
        run: |
          scripts/install_catch2v3.sh "$HOME/usr"

      - name: Build and test (FetchContent mode)
        run: |
          export DEPS="$HOME/usr"
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_CXX_COMPILER=mpicxx \
            -DPICNIX_USE_SYSTEM_LIBS=OFF \
            -DPICNIX_CATCH2_CONFIG="$DEPS/lib/cmake/Catch2/Catch2Config.cmake"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
