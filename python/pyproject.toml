[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picnix"
version = "0.1.0"
description = "Python data analysis tools for PIC-NIX simulations"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy>=1.10",
    "pyamg>=4.0",
    "tqdm",
    "msgpack",
    "h5py",
    "toml",
    "watchdog",
    "nest-asyncio",
    "aiofiles",
]

[project.optional-dependencies]
test = ["pytest"]
mpi = ["mpi4py"]
dev = ["ruff"]

[project.scripts]
picnix-hdf5-convert = "picnix.hdf5_converter:main"
picnix-loadchecker = "picnix.loadchecker:main"
picnix-memory-estimator = "picnix.memory_estimator:main"
picnix-msgpack-printer = "picnix.msgpack_printer:main"
picnix-syncdir = "picnix.syncdir:main"

[tool.hatch.build.targets.wheel]
packages = ["src/picnix"]
