  delh = 0.25
  Npc = 4
  Mpc = 16
  mie = 100.0
  tie = 1.0
  chi0 = 0.0
  betae = 1.0
  vcpa = 0.70710678118654757
  vcpe = 0.70710678118654757
  nb = 0.02
  vbd = 10.0
